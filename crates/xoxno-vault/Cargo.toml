[package]
name = "xoxno-vault"
version = "0.2.0"
license.workspace = true
edition = "2021"
description = "SEP-56 tokenized vault over a XOXNO lending position, for YBC PT/YT markets"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-tokens = { workspace = true }
vault-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
vault-testkit = { workspace = true }
proptest = { workspace = true }
