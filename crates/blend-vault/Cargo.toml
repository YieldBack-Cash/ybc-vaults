[package]
name = "blend-vault"
version = "0.1.2"
authors = ["Script3 Ltd. <gm@script3.io>", "YieldBack.Cash"]
license = "GPL-3.0-only AND MIT"
edition = "2021"
publish = false
description = "SEP-56 tokenized vault over a Blend pool supply position, for YBC PT/YT markets"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-tokens = { workspace = true }
vault-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
vault-testkit = { workspace = true }
proptest = { workspace = true }
