# Reproducible release builds of the two adapters through Stellar Expert's
# workflow: on a version tag each is built in a pinned container, its WASM and
# hash attached to a GitHub release, and the build registered so the explorer
# shows a deployed vault as verified against this source.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        package:
          - blend-vault
          - xoxno-vault
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # main, 2026-09-30
    with:
      release_name: ${{ github.ref_name }}
      release_description: "YBC ${{ matrix.package }} at ${{ github.ref_name }}; WASM hash attached for on-chain verification"
      package: ${{ matrix.package }}
      home_domain: yieldback.cash
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
