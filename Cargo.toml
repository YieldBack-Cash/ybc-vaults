[workspace]
resolver = "2"
members = [
  "crates/vault-common",
  "crates/vault-testkit",
  "crates/blend-vault",
  "crates/xoxno-vault",
]

[workspace.package]
license = "GPL-3.0-only"

[workspace.dependencies]
# Must match ybc-contracts: a mismatched SDK makes Env/Address incompatible
# across the call boundary in any test that links both. 26.1 is the newest
# SDK the OpenZeppelin 0.7.2 crates support.
soroban-sdk = "26.1.1"
stellar-tokens = "0.7.2"
proptest = "1"
vault-common = { path = "crates/vault-common" }
vault-testkit = { path = "crates/vault-testkit" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
